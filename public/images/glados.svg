<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 550">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a0800"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="glowAmbient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pupilGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="700" height="550" fill="url(#bgGrad)"/>

  <!-- Ambient glow -->
  <circle cx="350" cy="240" r="230" fill="url(#glowAmbient)"/>

  <!-- Outer decorative rings -->
  <circle cx="350" cy="240" r="215" fill="none" stroke="#F97316" stroke-width="0.5" opacity="0.12"/>
  <circle cx="350" cy="240" r="195" fill="none" stroke="#F97316" stroke-width="0.5" opacity="0.18"/>
  <circle cx="350" cy="240" r="175" fill="none" stroke="#F97316" stroke-width="1"   opacity="0.25"/>

  <!-- Main eye ring -->
  <circle cx="350" cy="240" r="138" fill="none" stroke="#F97316" stroke-width="6" filter="url(#glow)"/>

  <!-- Inner ring -->
  <circle cx="350" cy="240" r="92" fill="none" stroke="#F97316" stroke-width="1.5" opacity="0.45"/>

  <!-- Pupil -->
  <circle cx="350" cy="240" r="50" fill="url(#pupilGrad)" filter="url(#glow)"/>

  <!-- Pupil highlight -->
  <circle cx="334" cy="224" r="11" fill="white" opacity="0.22"/>

  <!-- Crosshair ticks -->
  <line x1="350" y1="82"  x2="350" y2="122" stroke="#F97316" stroke-width="2" opacity="0.4"/>
  <line x1="350" y1="358" x2="350" y2="398" stroke="#F97316" stroke-width="2" opacity="0.4"/>
  <line x1="192" y1="240" x2="232" y2="240" stroke="#F97316" stroke-width="2" opacity="0.4"/>
  <line x1="468" y1="240" x2="508" y2="240" stroke="#F97316" stroke-width="2" opacity="0.4"/>

  <!-- GLaDOS wordmark -->
  <text
    x="350" y="446"
    font-family="'Courier New', Courier, monospace"
    font-size="46"
    font-weight="bold"
    fill="#F97316"
    text-anchor="middle"
    letter-spacing="7"
    filter="url(#glowSoft)"
  >GLaDOS</text>

  <!-- Subtitle -->
  <text
    x="350" y="476"
    font-family="'Courier New', Courier, monospace"
    font-size="11"
    fill="#F97316"
    text-anchor="middle"
    opacity="0.5"
    letter-spacing="4.5"
  >KNOWLEDGE MANAGEMENT SYSTEM</text>
</svg>
