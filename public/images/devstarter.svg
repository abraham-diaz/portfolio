<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 550">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="700" height="550" fill="url(#bg)"/>

  <!-- Terminal window -->
  <rect x="28" y="28" width="644" height="494" rx="14" fill="url(#termBg)"/>

  <!-- Title bar -->
  <rect x="28" y="28" width="644" height="46" rx="14" fill="#12121f"/>
  <rect x="28" y="60" width="644" height="14" fill="#12121f"/>

  <!-- Window dots -->
  <circle cx="62"  cy="51" r="7" fill="#ff5f57"/>
  <circle cx="88"  cy="51" r="7" fill="#febc2e"/>
  <circle cx="114" cy="51" r="7" fill="#28c840"/>

  <!-- Tab title -->
  <text x="350" y="56" font-family="'Courier New', monospace" font-size="13" fill="#64748b" text-anchor="middle">zsh — 80×24</text>

  <!-- Prompt + command -->
  <text x="58" y="126" font-family="'Courier New', monospace" font-size="17" fill="#22c55e">❯</text>
  <text x="80" y="126" font-family="'Courier New', monospace" font-size="17" fill="#e2e8f0">npx devstarter </text>
  <text x="296" y="126" font-family="'Courier New', monospace" font-size="17" fill="#22c55e">init</text>

  <!-- Output: scaffolding -->
  <text x="58" y="162" font-family="'Courier New', monospace" font-size="15" fill="#22c55e">✓</text>
  <text x="78" y="162" font-family="'Courier New', monospace" font-size="15" fill="#94a3b8">Scaffolding </text>
  <text x="202" y="162" font-family="'Courier New', monospace" font-size="15" fill="#f1f5f9">my-project</text>
  <text x="333" y="162" font-family="'Courier New', monospace" font-size="15" fill="#3b82f6">  [frontend]</text>

  <!-- File tree -->
  <text x="58"  y="198" font-family="'Courier New', monospace" font-size="14" fill="#64748b">  my-project/</text>
  <text x="58"  y="222" font-family="'Courier New', monospace" font-size="14" fill="#475569">  ├─ </text>
  <text x="108" y="222" font-family="'Courier New', monospace" font-size="14" fill="#94a3b8">src/</text>
  <text x="58"  y="246" font-family="'Courier New', monospace" font-size="14" fill="#475569">  ├─ </text>
  <text x="108" y="246" font-family="'Courier New', monospace" font-size="14" fill="#94a3b8">package.json</text>
  <text x="58"  y="270" font-family="'Courier New', monospace" font-size="14" fill="#475569">  ├─ </text>
  <text x="108" y="270" font-family="'Courier New', monospace" font-size="14" fill="#94a3b8">tsconfig.json</text>
  <text x="58"  y="294" font-family="'Courier New', monospace" font-size="14" fill="#475569">  ├─ </text>
  <text x="108" y="294" font-family="'Courier New', monospace" font-size="14" fill="#94a3b8">vite.config.ts</text>
  <text x="58"  y="318" font-family="'Courier New', monospace" font-size="14" fill="#475569">  └─ </text>
  <text x="108" y="318" font-family="'Courier New', monospace" font-size="14" fill="#94a3b8">.eslintrc.json</text>

  <!-- Divider -->
  <line x1="58" y1="340" x2="644" y2="340" stroke="#1e293b" stroke-width="1"/>

  <!-- Next steps -->
  <text x="58" y="366" font-family="'Courier New', monospace" font-size="14" fill="#64748b">Next steps:</text>

  <text x="58"  y="392" font-family="'Courier New', monospace" font-size="14" fill="#475569">  $ </text>
  <text x="86"  y="392" font-family="'Courier New', monospace" font-size="14" fill="#94a3b8">cd </text>
  <text x="116" y="392" font-family="'Courier New', monospace" font-size="14" fill="#e2e8f0">my-project</text>

  <text x="58"  y="416" font-family="'Courier New', monospace" font-size="14" fill="#475569">  $ </text>
  <text x="86"  y="416" font-family="'Courier New', monospace" font-size="14" fill="#94a3b8">npm install</text>

  <text x="58"  y="440" font-family="'Courier New', monospace" font-size="14" fill="#475569">  $ </text>
  <text x="86"  y="440" font-family="'Courier New', monospace" font-size="14" fill="#94a3b8">npm run </text>
  <text x="172" y="440" font-family="'Courier New', monospace" font-size="14" fill="#22c55e">dev</text>

  <!-- New prompt with cursor -->
  <text x="58" y="474" font-family="'Courier New', monospace" font-size="17" fill="#22c55e" opacity="0.6">❯</text>
  <rect x="80" y="459" width="10" height="18" fill="#22c55e" opacity="0.75"/>

  <!-- Branding -->
  <text x="448" y="502" font-family="'Courier New', monospace" font-size="24" font-weight="bold" fill="#e2e8f0">devstarter</text>
  <text x="613" y="502" font-family="'Courier New', monospace" font-size="24" fill="#22c55e">-cli</text>

  <!-- Lightning bolt -->
  <polygon points="648,354 630,404 648,404 634,450 666,390 648,390 664,354" fill="#22c55e" opacity="0.85" filter="url(#glowGreen)"/>
</svg>
